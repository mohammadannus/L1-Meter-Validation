name: Continuous Integration

on:
  push:
    branches: [ "feature/devops-mlops", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Prevents the app's lifespan from loading PaddleOCR models during tests
      PRELOAD_MODELS: "0"
      # Avoids paddle warning noise about ccache in CI logs
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx
        # Lightweight deps the app imports at module load:
        pip install fastapi uvicorn python-multipart pydantic pyyaml pillow numpy
        # Heavy ML deps — imported by api/ocr_engine.py at module level
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install paddlepaddle

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short