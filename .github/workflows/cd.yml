name: Build and Push Docker Image

on:
  push:
    branches: [ "feature/devops-mlops" ]
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/mohammadannus/l1-meter-validation/meter-app:latest

        # 🚀 AUTOMATED DEPLOYMENT STEP
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ghcr.io/mohammadannus/l1-meter-validation/meter-app:latest
          docker stop meter-app || true
          docker rm meter-app || true
          docker run -d --name meter-app -p 8000:8000 --restart unless-stopped ghcr.io/mohammadannus/l1-meter-validation/meter-app:latest