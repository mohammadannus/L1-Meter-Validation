name: Build and Push Docker Image

on:
  push:
    branches: [ "feature/devops-mlops" ]
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # GitHub requires the image name to be lowercase
        tags: ghcr.io/mohammadannus/l1-meter-validation/meter-app:latest